# goku.yaml — goku's own manifest (dogfood).
#
# Deployed by goku itself as one container per service plus a postgres
# container per database resource — exactly what the architecture diagram
# shows: web (static caddy), api (gokud), db (postgres:18).

services:
  api:
    type: api            # gokud — Go control plane (REST, git smart-HTTP, OAuth, webhooks)
    size: small
    port: 8080
    health_check: /auth/providers
    # Self-hosting: the api container IS the control plane, so it needs the
    # machine. host_mounts is honored only for operator-org projects.
    host_mounts:
      - /var/lib/goku:/var/lib/goku            # bare repos
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/goku:/etc/goku                    # apps.caddy (rw)
      - /etc/caddy:/etc/caddy:ro               # caddy reload needs the config
  web:
    type: web            # React + Vite SPA served by a static caddy container
    target: web          # Dockerfile stage holding the built assets
    dist: /src/web/dist
    spa: true

resources:
  db:
    type: database       # postgres:18 container with a persistent volume

routes:
  - domain: goku.host    # TLS via the host Caddy + Let's Encrypt
    service: api
    paths: ["/v1/*", "/git/*", "/auth/*", "/hooks/*"]
  - domain: goku.host
    service: web         # everything else: the SPA
